[pytest]
pythonpath = lib/python

# Every suite root, listed rather than discovered: pytest only warns when a path collects
# nothing, so tests/test_catalog.py asserts each one exists and that no suite written here
# is missing from this list. Upstream skills ship their own tests, which are not ours to run.
testpaths =
    tests
    bundles/product-team/skills/product-lead/scripts/tests
    skills/cc-fewer-permission-prompts/tests
    skills/coderabbit/tests
    skills/commit/tests
    skills/diagram/scripts/tests
    skills/jira/tests
    skills/pr/tests
    skills/ship/tests
